version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
  - package-ecosystem: 'cargo'
    directory: '/systemd-container-shell'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
