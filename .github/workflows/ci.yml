name: ❄️
on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, opened, synchronize, reopened]
  schedule:
    # Every 10:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 1 * * *'
  workflow_dispatch:

permissions:
  contents: read # For checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event.action != 'labeled' }}

jobs:
  tasks:
    name: 🔨 Tasks (${{ matrix.os }})
    if: github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    outputs:
      flake_lock_changed: ${{ steps.check-flake-lock.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check if flake.lock changed
        id: check-flake-lock
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet HEAD^1 HEAD -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: NixOS/nix-installer-action@62c1943b776c509394b550f3f983adc14e9212d6 # v1.0.0
        with:
          extra-conf: |
            sandbox = true
            accept-flake-config = true
      - run: nix flake check
      - run: nix develop --command echo 'This step should be done before any other "nix develop" steps because of measuring Nix build time'
      - run: nix develop --command task check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: nix build .#systemd-container-shell

  diff:
    name: ↔️ Diff
    needs: [tasks]
    if: >-
      always() &&
      !failure() &&
      !cancelled() &&
      github.event_name == 'pull_request' &&
      (contains(github.event.pull_request.labels.*.name, 'ci-nix-diff') ||
       (github.event.action != 'labeled' && needs.tasks.outputs.flake_lock_changed == 'true'))
    permissions:
      contents: read
      pull-requests: write # Required for commenting closure diffs on PRs
    uses: kachick/workflows/.github/workflows/reusable-nix-diff-closures.yml@main # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ubuntu-26.04
      targets: |
        packages.x86_64-linux.default
        devShells.x86_64-linux.default
