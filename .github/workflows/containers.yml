name: Containers
on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - '**Containerfile'
      - '.containerignore'
      - '.github/workflows/containers.yml'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - labeled
    paths:
      - '**Containerfile'
      - '.containerignore'
      - '.github/workflows/containers.yml'
  # Don't push same image with different digest even through scheduled triggers
  schedule:
    # Every 11:42 and 23:42 JST
    # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron: '42 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: read # Required for actions/checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # podman can handle lowercase. So normalize the outputs
  get-meta:
    name: 📋 Meta
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.timestamp.outputs.started_at }}
      ref_tag: ${{ steps.tags.outputs.ref }}
      special_tag: ${{ steps.tags.outputs.special }}
      timestamp_tag: ${{ steps.tags.outputs.timestamp }}
      should_push: ${{ steps.check-should-push.outputs.result }}
    steps:
      - name: Get started timestamp
        id: timestamp
        run: |
          # Do not use ":" delimiter as iso-8601/rfc-3339, it cannot be used in container tag
          echo started_at="$(date --utc '+%Y%m%d-%H%M%S-%Z')" | ruby -pe '$_.downcase!' | tee -a "$GITHUB_OUTPUT"
      - name: Generate tags for the image
        id: tags
        # https://github.com/orgs/community/discussions/26557#discussioncomment-3252327
        env:
          STARTED_AT: ${{ steps.timestamp.outputs.started_at }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          echo "timestamp=${STARTED_AT}" | tee -a "$GITHUB_OUTPUT"

          special=''
          ref=''

          if [ "$EVENT_NAME" = 'pull_request' ]; then
            special="pr-${PR_NUMBER}-${PR_HEAD_SHA}"
            ref="$PR_HEAD_SHA"
          elif [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            special='latest'
            ref="$GITHUB_SHA"
          else
            exit 1
          fi

          echo "special=${special}" | tee -a "$GITHUB_OUTPUT"
          echo "ref=${ref}" | tee -a "$GITHUB_OUTPUT"
      - name: Check if should push
        id: check-should-push
        env:
          SHOULD_PUSH: ${{ (github.event_name == 'push') || (github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-staging')) }}
        run: |
          echo "result=${SHOULD_PUSH}" | tee -a "$GITHUB_OUTPUT"
  ubuntu-nix-systemd:
    name: 📦 ubuntu-nix-systemd
    permissions:
      contents: read
      packages: write # Required for pushing container images to GHCR
    needs: [get-meta]
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      package-json: ${{ steps.inspect-package.outputs.json }}
    steps:
      - name: Logging dependency versions
        run: |
          podman version
          crun --version
          buildah version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Image
        id: build-image
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: ubuntu-26.04-nix-systemd
          tags: ${{ needs.get-meta.outputs.ref_tag }}
          containerfiles: |
            ./images/ubuntu-nix-systemd/Containerfile
          oci: true
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      #   with:
      #     limit-access-to-actor: true
      - name: Inspect the created image
        env:
          IMAGE_NAME: ${{ steps.build-image.outputs.image }}
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
        run: |
          podman inspect "localhost/${IMAGE_NAME}:${REF_TAG}"
      - name: Push To ghcr.io
        id: push-to-ghcr
        if: ${{ (github.actor == github.repository_owner) && (needs.get-meta.outputs.should_push == 'true') }}
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_NAME: ${{ steps.build-image.outputs.image }}
          REF_TAG: ${{ needs.get-meta.outputs.ref_tag }}
          SPECIAL_TAG: ${{ needs.get-meta.outputs.special_tag }}
          TIMESTAMP_TAG: ${{ needs.get-meta.outputs.timestamp_tag }}
        run: |
          set -euxo pipefail

          tags="${SPECIAL_TAG} ${REF_TAG} ${TIMESTAMP_TAG}"
          registry="ghcr.io/${REPOSITORY_OWNER}"

          for tag in $tags; do
            full_image_name="${registry}/${IMAGE_NAME}:${tag}"
            podman tag "${IMAGE_NAME}:${REF_TAG}" "${full_image_name}"
            # Using --creds to avoid podman login
            # --digestfile is used to capture the digest for the next step
            podman push --creds="${REPOSITORY_OWNER}:${GITHUB_TOKEN}" --digestfile=digest.txt "${full_image_name}"
          done

          # Capture the digest of the last pushed tag (they should all have the same digest since they are the same image)
          echo "digest=$(cat digest.txt)" >> "$GITHUB_OUTPUT"
      - name: Log outputs
        if: ${{ steps.push-to-ghcr.outcome == 'success' }}
        env:
          OUTPUTS_JSON: ${{ toJSON(steps.push-to-ghcr.outputs) }}
        run: echo "${OUTPUTS_JSON}"
      - name: Inspect the package
        id: inspect-package
        if: ${{ steps.push-to-ghcr.outcome == 'success' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          DIGEST: ${{ steps.push-to-ghcr.outputs.digest }}
        run: | #shell
          #
          set -euxo pipefail

          {
            echo 'json<<JSON'

            gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/users/${REPOSITORY_OWNER}/packages/container/ubuntu-26.04-nix-systemd/versions" \
            --jq ".[] | select(.name == \"${DIGEST}\")" | \
              jq

            echo 'JSON'
          } | tee --append "$GITHUB_OUTPUT"

  announce-staging:
    name: 📢 announce-staging
    permissions:
      contents: read
      pull-requests: write # Required for posting deploy comments
    needs: [get-meta, ubuntu-nix-systemd]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Prepare git to run gh commands
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Post comments
        if: ${{ (github.actor == github.repository_owner) && (github.event_name == 'pull_request') && (needs.get-meta.outputs.should_push == 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.number }}
          SPECIAL_TAG: ${{ needs.get-meta.outputs.special_tag }}
          PACKAGE_JSON: ${{ needs.ubuntu-nix-systemd.outputs.package-json }}
        run: |
          package_id="$(echo "$PACKAGE_JSON" | jq -r '.id')"
          (
          cat <<EOF
          ⬢🦭 Staging container-image has been deployed 🚀

          You can test the interactive shell 🐚 as follows.

          \`\`\`bash
          nix run github:${REPOSITORY}/${PR_HEAD_SHA}#systemd-container-shell -- pull ${PR_HEAD_SHA}
          \`\`\`

          [Package detail](https://github.com/${REPOSITORY}/pkgs/container/ubuntu-26.04-nix-systemd/${package_id}?tag=${SPECIAL_TAG})

          This image will be automatically 🤖 removed from ghcr.io 🗑️ if you merged/closed this PR 😌
          EOF
          ) | gh pr comment "${PR_NUMBER}" --body-file -
