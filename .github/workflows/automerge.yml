name: 🤖👌🤖

permissions:
  contents: read # For checkout and reusable workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  pull_request:
    paths:
      - '.github/workflows/automerge.yml'
  schedule:
    # 8 is not strict; it comes from: `gh api repos/:owner/:repo --jq '.id % 60'`
    - cron: '8 */6 * * *'
  workflow_dispatch:

jobs:
  automerge:
    name: 🤖👌🤖
    uses: kachick/workflows/.github/workflows/reusable-automerge.yml@main # zizmor: ignore[unpinned-uses]
    with:
      app-id: ${{ vars.SAMU_APP_ID }}
      llm-veto: true
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.SAMU_APP_PRIVATE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
