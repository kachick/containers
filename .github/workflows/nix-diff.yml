name: ❄️ Diff
on:
  pull_request:
    paths:
      - 'flake.lock'
      - '.github/workflows/nix-diff.yml'

permissions:
  contents: read # For checkout and reusable workflows

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  diff:
    name: ❄️ Diff
    permissions:
      contents: read
      pull-requests: write # Required for commenting closure diffs on PRs
    uses: kachick/workflows/.github/workflows/reusable-nix-diff-closures.yml@main # zizmor: ignore[unpinned-uses]
    with:
      runs-on: ubuntu-26.04
      targets: |
        packages.x86_64-linux.default
        devShells.x86_64-linux.default
