# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    cmds:
      - echo 'Update here'
  fmt:
    cmds:
      - dprint fmt
      - cargo fmt --manifest-path systemd-container-shell/Cargo.toml
  lint:
    cmds:
      - dprint check
      - typos . .github .vscode
      - zizmor --pedantic .
      - trivy config --exit-code 1 .
      - cargo clippy --manifest-path systemd-container-shell/Cargo.toml -- -D warnings
  try:
    cmds:
      - cargo run --manifest-path systemd-container-shell/Cargo.toml -- {{.CLI_ARGS}}
  'systemd:try':
    cmds:
      - task: try
        vars: { CLI_ARGS: 'build' }
  'systemd:ghcr':
    cmds:
      - task: try
        vars: { CLI_ARGS: "pull {{.TAG | default \"latest\"}}" }
