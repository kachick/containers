# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: lint
      - task: test
  check:
    deps:
      - task: test
      - task: lint
  test:
    dir: systemd-container-shell
    cmds:
      - go test ./...
  fmt:
    cmds:
      - dprint fmt
      - gofmt -s -w systemd-container-shell
  fix:
    dir: systemd-container-shell
    cmds:
      - go fix ./...
  lint-go:
    internal: true
    dir: systemd-container-shell
    cmds:
      - test -z "$(gofmt -s -l .)"
      - go vet ./...
      - go fix -diff ./...
  lint:
    deps:
      - task: lint-go
    cmds:
      - dprint check
      - typos . .github .vscode
      - zizmor --pedantic .
      - trivy config --exit-code 1 .
  build:
    internal: true
    dir: systemd-container-shell
    cmds:
      - mkdir -p ../tmp
      - go build -o ../tmp/systemd-container-shell .
  try:
    deps:
      - task: build
    cmds:
      - ./tmp/systemd-container-shell {{.CLI_ARGS}}
  'systemd:try':
    cmds:
      - task: try
        vars: { CLI_ARGS: 'build' }
  'systemd:ghcr':
    cmds:
      - task: try
        vars: { CLI_ARGS: "pull {{.TAG | default \"latest\"}}" }
